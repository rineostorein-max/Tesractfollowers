<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesseract — AI Assistance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,500,0,0" rel="stylesheet">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('tv-theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    })();
  </script>
  <style>
    @view-transition { navigation: auto; }
    :root {
      --gold-lt: #ffe494;
      --gold: #f0c14d;
      --gold-dk: #b87e14;
      --blue: #0095f6;
      --bg: radial-gradient(circle at 80% 10%, rgba(240, 193, 77, 0.15), transparent 45%),
            radial-gradient(circle at 20% 80%, rgba(184, 126, 20, 0.1), transparent 50%), #09090b;
      --header: rgba(15, 15, 15, 0.38);
      --glass: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --muted: #bdbdc7;
    }

    [data-theme="light"] {
      --bg: radial-gradient(circle at 80% 10%, rgba(240, 193, 77, 0.25), transparent 45%),
            radial-gradient(circle at 20% 80%, rgba(212, 160, 50, 0.12), transparent 50%), #f4f5f8;
      --header: rgba(255, 255, 255, 0.5);
      --glass: rgba(255, 255, 255, 0.65);
      --border: rgba(0, 0, 0, 0.12);
      --text: #0f0f12;
      --muted: #4a4a55;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg) fixed; height: 100vh; height: 100dvh; overflow: hidden; line-height: 1.65; }
    .container { width: min(100% - 2.5rem, 1180px); margin-inline: auto; }

    /* ---------- Temporary Click Ripple & Border Animation ---------- */
    .tap-fx { position: relative; overflow: hidden; transition: transform 0.2s ease; }
    .tap-fx::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
      background: radial-gradient(circle 90px at var(--rx, 50%) var(--ry, 50%), rgba(240, 193, 77, 0.45), transparent 70%);
    }
    .tap-fx.pulsing { animation: btnPulse 0.5s ease-out; }
    .tap-fx.pulsing::after { animation: rippleFade 0.5s ease-out; }
    @keyframes btnPulse {
      0% { transform: scale(0.95); border-color: var(--gold); box-shadow: 0 0 22px rgba(240, 193, 77, 0.55); }
      60% { transform: scale(1.01); border-color: var(--gold-lt); }
      100% { transform: scale(1); border-color: var(--border); box-shadow: none; }
    }
    @keyframes rippleFade { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* ---------- Help Center Page (AI Assistance) ---------- */
    .help-page {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg) fixed;
      display: flex;
      flex-direction: column;
      animation: pageEnter 0.35s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .help-header {
      height: 62px;
      flex-shrink: 0;
      background: var(--header);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .help-nav {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      height: 100%;
    }
    .back-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      flex-shrink: 0;
      text-decoration: none;
    }
    .back-btn span {
      font-size: 18px;
    }
    .ai-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--text), var(--gold), var(--text));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    /* Help Center Scrollable Chat Area */
    .help-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem 0;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }
    .help-body::-webkit-scrollbar { width: 5px; }
    .help-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .help-messages {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: auto;
      width: min(100% - 2rem, 780px);
      margin-inline: auto;
    }

    /* Date Badge on Top of Messages */
    .chat-date-badge {
      align-self: center;
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--gold-lt);
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      margin-bottom: 0.3rem;
      user-select: none;
    }
    [data-theme="light"] .chat-date-badge {
      color: var(--gold-dk);
    }

    /* Message Bubbles */
    .msg-bubble {
      position: relative;
      min-width: 140px;
      max-width: min(86%, 560px);
      padding: 0.95rem 1.2rem 0.7rem;
      border-radius: 20px;
      font-size: 1.02rem;
      line-height: 1.6;
      word-wrap: break-word;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.22);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      animation: msgPop 0.25s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes msgPop {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* User Message -> Right Side */
    .msg-user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(255, 228, 148, 0.22), rgba(240, 193, 77, 0.34), rgba(184, 126, 20, 0.24));
      border: 1px solid rgba(240, 193, 77, 0.45);
      color: var(--text);
      border-bottom-right-radius: 6px;
    }
    [data-theme="light"] .msg-user {
      background: linear-gradient(135deg, rgba(255, 228, 148, 0.75), rgba(240, 193, 77, 0.5));
      color: #2b1d00;
    }

    /* AI Message -> Left Side */
    .msg-ai {
      align-self: flex-start;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 6px;
    }

    /* 12-Hour Time on Right Side Inside Bubble */
    .msg-time {
      align-self: flex-end;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      opacity: 0.88;
      letter-spacing: 0.02em;
      margin-left: auto;
      user-select: none;
    }
    .msg-user .msg-time {
      color: var(--gold-lt);
    }
    [data-theme="light"] .msg-user .msg-time {
      color: #5c3d00;
    }

    /* Typing Indicator Animation (Left Side for AI Delay) */
    .typing-bubble {
      align-self: flex-start;
      padding: 0.95rem 1.25rem;
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.22);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: msgPop 0.25s cubic-bezier(.22,1,.36,1) both;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.4;
      animation: typingBounce 1.3s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .typing-dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.4; }
      40% { transform: translateY(-5px) scale(1.1); opacity: 1; }
    }

    /* Help Center Bottom Typing Box */
    .help-footer {
      flex-shrink: 0;
      padding: 0.65rem 0 calc(0.95rem + env(safe-area-inset-bottom, 0px));
    }
    .input-box-wrap {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      width: min(100%, 760px);
      margin-inline: auto;
      padding: 8px 10px 8px 18px;
      border-radius: 26px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.28);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .input-box-wrap:focus-within {
      border-color: rgba(240, 193, 77, 0.48);
      box-shadow: 0 8px 30px rgba(240, 193, 77, 0.14);
    }
    .chat-textarea {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.98rem;
      line-height: 1.5;
      resize: none;
      max-height: 130px;
      min-height: 24px;
      padding: 5px 0;
      overflow-y: hidden;
    }
    .chat-textarea::placeholder {
      color: var(--muted);
      opacity: 0.72;
    }
    .chat-textarea::-webkit-scrollbar { width: 4px; }
    .chat-textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* Send Button Inside Input Box */
    .send-inside-btn {
      width: 0;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--gold-lt), var(--gold), var(--gold-dk));
      color: #09090b;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
      overflow: hidden;
      transition: width 0.22s ease, opacity 0.22s ease, transform 0.25s cubic-bezier(.34,1.56,.64,1);
    }
    .send-inside-btn.visible {
      width: 36px;
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .send-inside-btn span {
      font-size: 19px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Help Center Page (AI Assistance) -->
  <section class="help-page" id="helpPage">
    <header class="help-header">
      <div class="container help-nav">
        <button type="button" class="back-btn tap-fx" id="helpBackBtn" aria-label="Back to Main Menu">
          <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <span class="ai-title">AI Assistance</span>
      </div>
    </header>

    <div class="help-body" id="helpBody">
      <div class="help-messages" id="helpMessages"></div>
    </div>

    <footer class="help-footer">
      <div class="container">
        <div class="input-box-wrap">
          <textarea
            id="questionInput"
            class="chat-textarea"
            rows="1"
            placeholder="Ask question.."
          ></textarea>
          <button type="button" class="send-inside-btn tap-fx" id="sendQuestionBtn" aria-label="Send">
            <span class="material-symbols-rounded">send</span>
          </button>
        </div>
      </div>
    </footer>
  </section>

  <script>
    const helpBackBtn = document.getElementById('helpBackBtn');
    const questionInput = document.getElementById('questionInput');
    const sendQuestionBtn = document.getElementById('sendQuestionBtn');
    const helpMessages = document.getElementById('helpMessages');
    const helpBody = document.getElementById('helpBody');

    let lastRenderedDate = '';

    // Sync theme if changed in another tab
    window.addEventListener('storage', (e) => {
      if (e.key === 'tv-theme' && e.newValue) {
        document.documentElement.dataset.theme = e.newValue;
      }
    });

    // One-Click Golden Ripple & Temporary Border Effect
    document.querySelectorAll('.tap-fx').forEach(btn => {
      btn.addEventListener('pointerdown', e => {
        const r = btn.getBoundingClientRect();
        btn.style.setProperty('--rx', `${e.clientX - r.left}px`);
        btn.style.setProperty('--ry', `${e.clientY - r.top}px`);
        btn.classList.remove('pulsing');
        void btn.offsetWidth;
        btn.classList.add('pulsing');
      });
      btn.addEventListener('animationend', () => btn.classList.remove('pulsing'));
    });

    // Back Button Navigation to Home Page
    helpBackBtn.addEventListener('click', () => {
      questionInput.blur();
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 150);
    });

    // Format Date & 12-Hour Time with AM/PM
    function getFormattedDate(d = new Date()) {
      return d.toLocaleDateString('en-US', {
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function getFormatted12HrTime(d = new Date()) {
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      return `${hours}:${minutes} ${ampm}`;
    }

    // Ensure Date Header is Added Above Messages
    function ensureDateBadge() {
      const todayStr = getFormattedDate();
      if (lastRenderedDate !== todayStr) {
        const badge = document.createElement('div');
        badge.className = 'chat-date-badge';
        badge.textContent = todayStr;
        helpMessages.appendChild(badge);
        lastRenderedDate = todayStr;
      }
    }

    // Create Message Bubble (User on Right, AI on Left, Time on Right Side)
    function appendMessageBubble(text, sender = 'user') {
      ensureDateBadge();

      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${sender === 'user' ? 'msg-user' : 'msg-ai'}`;

      const textEl = document.createElement('div');
      textEl.className = 'msg-text';
      textEl.textContent = text;

      const timeEl = document.createElement('span');
      timeEl.className = 'msg-time';
      timeEl.textContent = getFormatted12HrTime();

      bubble.appendChild(textEl);
      bubble.appendChild(timeEl);
      helpMessages.appendChild(bubble);

      helpBody.scrollTop = helpBody.scrollHeight;
    }

    // Show / Remove Typing Indicator
    function showTypingIndicator() {
      ensureDateBadge();
      const typing = document.createElement('div');
      typing.className = 'typing-bubble';
      typing.id = 'aiTypingIndicator';
      typing.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      helpMessages.appendChild(typing);
      helpBody.scrollTop = helpBody.scrollHeight;
      return typing;
    }

    // Auto-Resize Textarea up to a Limit & Toggle Send Button Inside Box
    const MAX_INPUT_HEIGHT = 130;

    function syncInputBox() {
      questionInput.style.height = 'auto';
      const nextHeight = Math.min(questionInput.scrollHeight, MAX_INPUT_HEIGHT);
      questionInput.style.height = `${nextHeight}px`;
      questionInput.style.overflowY = questionInput.scrollHeight > MAX_INPUT_HEIGHT ? 'auto' : 'hidden';

      if (questionInput.value.length > 0) {
        sendQuestionBtn.classList.add('visible');
      } else {
        sendQuestionBtn.classList.remove('visible');
      }
    }

    questionInput.addEventListener('input', syncInputBox);

    // Fetch Reply from Provided AI Endpoint
    async function fetchAIReply(userPrompt) {
      const apiUrl = `https://jerrycoder.oggyapi.workers.dev/ai/gpt4?prompt=${encodeURIComponent(userPrompt)}&model=4.3`;
      const response = await fetch(apiUrl, { method: 'GET' });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const rawText = await response.text();
      try {
        const data = JSON.parse(rawText);
        if (typeof data === 'string') return data;
        return (
          data.response ||
          data.reply ||
          data.answer ||
          data.result ||
          data.message ||
          data.text ||
          data.content ||
          (data.data && (data.data.response || data.data.text || data.data.answer)) ||
          rawText
        );
      } catch {
        return rawText;
      }
    }

    // Send Message & Trigger AI Response
    async function handleSendQuestion() {
      const text = questionInput.value.trim();
      if (!text) return;

      questionInput.value = '';
      syncInputBox();

      appendMessageBubble(text, 'user');
      const typingEl = showTypingIndicator();

      try {
        const aiAnswer = await fetchAIReply(text);
        typingEl.remove();
        appendMessageBubble(String(aiAnswer).trim() || '...', 'ai');
      } catch (err) {
        typingEl.remove();
        appendMessageBubble('Unable to reach AI server right now. Please try again in a moment.', 'ai');
      }
    }

    sendQuestionBtn.addEventListener('click', handleSendQuestion);
  </script>
</body>
</html>
